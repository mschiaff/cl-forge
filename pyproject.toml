[project]
name = "cl-forge"
description = "Simple yet powerful Chilean and other tools written in Rust and Python."
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]

authors = [
    { name = "Matías Schiaffino Tyrer", email = "matias.scht@gmail.com"}
]

dependencies = [
    "orjson>=3.11.7",
    "pydantic>=2.12.5",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Typing :: Typed",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries",
]

keywords = [
    "chile", "cl",
    "utils", "tools",
    "rut", "run",
    "validators", "api",
    "python", "rust",
]

[project.urls]
Homepage = "https://mschiaff.github.io/cl-forge/"
Repository = "https://github.com/mschiaff/cl-forge.git"
Documentation = "https://mschiaff.github.io/cl-forge/"
Issues = "https://github.com/mschiaff/cl-forge/issues"

[build-system]
requires = ["maturin>=1.11.5"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/cl_forge/Cargo.toml"
module-name = "cl_forge.core.impl.rs_cl_forge"
include = [
    "README.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "src/cl_forge/**/*.pyi",
    "src/cl_forge/py.typed",
    "tests/*.py",
]
python-source = "src"
bindings = "pyo3"

[dependency-groups]
# Development
test = [
    "ruff>=0.15.0",
    "pytest>=8.0.0",
    "pyright>=1.1.408",
]

build = [
    "maturin>=1.11.5,<2.0",
]

docs = [
    "griffe-pydantic>=1.2.0",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.2",
]
dev = [
    {include-group = "build"},
    {include-group = "docs"},
    {include-group = "test"},
    "cl-forge[notebook]",
]

[project.optional-dependencies]
# Interoperability
pyarrow = [
    "pyarrow>=23.0.0",
]
polars = [
    "cl-forge[pyarrow]",
    "polars>=1.38.0",
]
pandas = [
    "cl-forge[pyarrow]",
    "pandas-stubs>=3.0.0.260204",
    "pandas[performance]>=3.0.0",
]
interop = [
    "cl-forge[polars]",
    "cl-forge[pandas]",
]

# Excel
calamine = [
    "fastexcel>=0.19.0",
]
xlsxwriter = [
    "xlsxwriter>=3.2.9",
]
openpyxl = [
    "openpyxl>=3.1.5",
]
excel = [
    "cl-forge[calamine]",
    "cl-forge[xlsxwriter]",
    "cl-forge[openpyxl]",
]

# Analytics
analytics = [
    "cl-forge[polars]",
    "cl-forge[calamine]",
    "cl-forge[xlsxwriter]",
]

# Jupyter Notebook
notebook = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "notebook>=7.5.3",
]

# All
all = [
    "cl-forge[interop]",
    "cl-forge[excel]",
    "cl-forge[notebook]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
junit_family = "legacy"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes errors
    "I",    # isort errors
    "N",    # naming conventions
    "UP",   # pyupgrade errors
    "B",    # bugbear errors
    "A",    # flake8-annotations errors
    "C4",   # flake8-comprehensions errors
    "TC",   # flake8-type-checking errors
    "SIM",   # flake8-simplify errors
    "RUF",  # ruff-specific rules
]
#ignore = []

#[tool.ruff.lint.per-file-ignores]
#src/cl_forge/... = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cl_forge"]